# ============================================================
# Nginx reverse proxy — SMAN 68 Jakarta
# Ganti "sman68jkt.sch.id" dengan domain Anda.
# Pasang ke: /etc/nginx/sites-available/sman68
# Aktifkan:  ln -s /etc/nginx/sites-available/sman68 /etc/nginx/sites-enabled/sman68
# ============================================================

server {
    listen 80;
    listen [::]:80;
    server_name sman68jkt.sch.id www.sman68jkt.sch.id;

    # Unggahan ke R2 lewat presigned URL (langsung dari browser), jadi cukup kecil.
    client_max_body_size 10m;

    # Challenge ACME (HTTP-01) — WAJIB di atas "location /" supaya tidak
    # diproxy ke Next.js. Siapkan foldernya:
    #   sudo mkdir -p /var/www/acme/.well-known/acme-challenge
    #   sudo chown -R www-data:www-data /var/www/acme
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type "text/plain";
        allow all;
    }

    # Aset build Next.js sudah immutable dari app — biarkan header dari Next.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Aset publik (gambar sekolah/fasilitas) — cache lebih lama di browser/CDN.
    location /assets/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=2592000";
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    gzip on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        image/svg+xml;
}
